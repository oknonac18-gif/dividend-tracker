name: Update Stock Data

on:
  schedule:
    - cron: '35 2 * * 1-5'   # JST 11:35（平日）
    - cron: '35 6 * * 1-5'   # JST 15:35（平日）
    - cron: '0 9 * * 1-5'    # JST 18:00（平日）
  workflow_dispatch:          # Actions タブから手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install yfinance

      - name: 株価データを取得
        run: python scripts/fetch_stocks.py

      - name: 銘柄名・セクターを日本語化
        run: python scripts/translate_names.py

      - name: 変更があればコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git diff --staged --quiet || git commit -m "chore: update stocks.json [skip ci]"
          git push
